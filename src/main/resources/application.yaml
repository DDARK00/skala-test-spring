spring:
  application:
    name: shop
  
  datasource:
    url: jdbc:h2:mem:shopdb
    driver-class-name: org.h2.Driver
    username: sa
    password:

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    defer-datasource-initialization: true
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.H2Dialect
  
  sql:
    init:
      mode: always
      data-locations: classpath:data.sql

mybatis:
  mapper-locations: classpath:mapper/**/*.xml
  type-aliases-package: com.skala.shop.data.entity
  configuration:
    map-underscore-to-camel-case: true

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.skala.shop: DEBUG
    org.springframework.web: INFO
    org.hibernate.SQL: WARN

management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always
  metrics:
    distribution:
      percentiles:
        "[order.service.duration]": 0.0, 0.5, 0.95, 0.99, 1.0
      percentiles-histogram:
        "[order.service.duration]": true

shop:
  customer:
    default-point: ${SHOP_DEFAULT_POINT:10000}
  jwt:
    secret: ${SHOP_JWT_SECRET}          # 기본값 없음 - 운영 배포 시 반드시 설정, 없으면 기동 실패 (의도된 동작)
    expiration: ${SHOP_JWT_EXPIRATION:3600000}

server:
  port: ${PORT:8080}    
